name: Employee job roles regression
on:
  push:
    branches: [main]
    paths:
      - 'v3/src/employee-jobs.js'
      - 'v3/src/simulation.js'
      - 'v3/src/routines.js'
      - 'v3/src/persistence.js'
      - 'v3/tests/employee-jobs.test.mjs'
      - '.github/workflows/jobs-regression.yml'
  workflow_dispatch:
jobs:
  employee-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify assignments, cover rules and existing saves
        run: node --experimental-default-type=module --test v3/tests/employee-jobs.test.mjs v3/tests/milestone-save.test.mjs
